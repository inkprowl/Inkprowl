name: Sync INKPROWL media to Cloudinary

on:
  push:
    branches: [main]
    paths:
      - "incoming/**"
  workflow_dispatch:
    inputs:
      operation:
        description: "sync processes files uploaded to incoming; delete removes a managed Cloudinary asset"
        required: true
        default: "sync"
        type: choice
        options: [sync, delete]
      asset_key:
        description: "Required only for delete; copy it from generated-catalog.json"
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: cloudinary-media-sync
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    env:
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Synchronize incoming media
        if: ${{ inputs.operation == '' || inputs.operation == 'sync' }}
        run: pnpm tsx scripts/sync-cloudinary-media.mjs sync
      - name: Delete selected managed media
        if: ${{ inputs.operation == 'delete' }}
        run: pnpm tsx scripts/sync-cloudinary-media.mjs delete "${{ inputs.asset_key }}"
      - name: Commit generated catalogue changes
        run: |
          if git diff --quiet; then
            echo "No generated catalogue changes to commit."
            exit 0
          fi
          git config user.name "inkprowl-media-bot"
          git config user.email "actions@github.com"
          git add incoming client/src/data/generated-catalog.json
          git commit -m "chore: synchronize Cloudinary media catalogue"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt ${attempt} was superseded by a newer owner change; rebasing the generated catalogue commit."
            git fetch origin main
            if git rebase origin/main; then
              continue
            fi
            echo "The owner catalogue changed during this sync. Leaving the immutable queue file in GitHub and starting a clean retry."
            git rebase --abort
            gh workflow run sync-cloudinary-media.yml --repo "${{ github.repository }}" --ref main -f operation=sync
            exit 0
          done
          echo "Unable to publish generated Cloudinary catalogue changes after three attempts."
          exit 1
